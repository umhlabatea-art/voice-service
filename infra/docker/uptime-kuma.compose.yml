# Uptime Kuma — production alerting for the Contraband Stack
# Deploy via Coolify: New Resource → Docker Compose → paste this file.
# Post-deploy: add monitors for Supabase REST URL, n8n webhook URL,
# ChromaDB heartbeat (/api/v1/heartbeat), Open WebUI, and the Umsavati web app.
# Wire notifications to the existing Telegram HITL bot (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID).

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  uptime-kuma-data:
